version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: qa-healthcare-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: qa_healthcare
      MYSQL_USER: qa_user
      MYSQL_PASSWORD: qa_password
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --init-connect='SET NAMES utf8mb4'
    networks:
      - qa-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: qa-healthcare-phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: qa_user
      PMA_PASSWORD: qa_password
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - qa-network

volumes:
  mysql_data:
    driver: local

networks:
  qa-network:
    driver: bridge
